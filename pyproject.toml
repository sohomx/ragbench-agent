[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ragbench-agent"
version = "0.0.1"
description = "a research agent over a real, messy corpus, with its own retrieval benchmark, eval suite and recorded-trace harness."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Sohom Pal" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools]
packages = ["retrieval", "agent", "evals"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
